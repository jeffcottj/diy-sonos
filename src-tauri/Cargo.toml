[package]
name = "multispot"
version = "1.0.0"
description = "Multispot Desktop"
authors = ["jeffcottj"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "multispot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "=0.63.2", features = [] }
mdns-sd = "0.21"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519"] }
regex = "1"
sha2 = "0.11"
data-encoding = "2"
[dev-dependencies]
tempfile = "3"
