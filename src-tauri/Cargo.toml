[package]
name = "diy-sonos"
version = "1.0.0"
description = "DIY Sonos Desktop"
authors = ["jeffcottj"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "diy_sonos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.63", features = [] }
mdns-sd = "0.21"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }
regex = "1"
sha2 = "0.11"
data-encoding = "2"
[dev-dependencies]
tempfile = "3"
